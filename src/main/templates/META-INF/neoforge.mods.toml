side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="immersiveengineering"
type="required"
versionRange="[${ie_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="kaleidoscope_cookery"
type="required"
versionRange="[${kc_version},)"
ordering="AFTER"
side="BOTH"
